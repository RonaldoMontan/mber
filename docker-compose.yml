services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: sh -c "python manage.py migrate && python manage.py setup_permissions && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - PORT=8000
      - ENVIRONMENT=stg

  frontend: # React
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - web
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000" # Você acessará o site em http://localhost:3000
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/}

volumes:
  frontend_node_modules:
